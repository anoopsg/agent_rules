name: Goldens

# Generated by agentx --bootstrap. Customize as needed.
# Enforces the golden-sandbox skill: goldens must be green on every PR.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload failures on diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            test/**/failures/
            **/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
